name: Merge v0 Images

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "pipeline@igamingpulse.media"
          git config user.name "iGaming Pipeline"

      - name: Check for new images
        id: check
        run: |
          git fetch origin
          NEW=$(git rev-list origin/main..origin/v0/article-featured-images --count)
          echo "new_commits=$NEW" >> $GITHUB_OUTPUT
          echo "New commits on v0 branch: $NEW"

      - name: Merge v0 images into main
        if: steps.check.outputs.new_commits != '0'
        run: |
          git reset --hard origin/main
          git merge origin/v0/article-featured-images --no-edit -m "merge: v0 featured images"
          git push origin main || (git pull --rebase origin main && git push origin main)
