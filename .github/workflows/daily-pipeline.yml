name: iGaming Daily Pipeline

on:
  schedule:
    - cron: '0 1 * * *'    # 1:00 UTC — target 6-9 AM Kyiv with GH Actions delay
    - cron: '0 2 * * *'    # 2:00 UTC — fallback
    - cron: '0 3 * * *'    # 3:00 UTC — fallback
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Claim publish slot (atomic marker)
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          MARKER=".pipeline/markers/published_${TODAY}.marker"
          if [ -f "$MARKER" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already published today, skipping."
            exit 0
          fi
          git config user.email "pipeline@igamingpulse.media"
          git config user.name "iGaming Pipeline"
          mkdir -p .pipeline/markers
          touch "$MARKER"
          git add .pipeline/markers/
          git commit -m "pipeline: published ${TODAY} [skip ci]"
          # Push the marker first — if another run already pushed it, this fails and we skip
          if ! git push; then
            git pull --rebase origin main
            if [ -f "$MARKER" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Another run already claimed this slot, skipping."
              exit 0
            fi
            git push || { echo "skip=true" >> $GITHUB_OUTPUT; exit 0; }
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install requests

      - name: Generate articles
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLES_JSON_PATH: ${{ github.workspace }}/articles_today.json
        run: python3 scripts/daily_articles.py

      - name: Request v0 images (async)
        if: steps.check.outputs.skip != 'true'
        env:
          V0_API_KEY: ${{ secrets.V0_API_KEY }}
        run: python3 scripts/request_v0_images.py articles_today.json

      - name: Configure git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.email "pipeline@igamingpulse.media"
          git config user.name "iGaming Pipeline"

      - name: Publish articles
        if: steps.check.outputs.skip != 'true'
        run: python3 add_articles.py articles_today.json
